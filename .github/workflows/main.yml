name: Build Gotham Gazette Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android tools
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Decode original APK
        run: java -jar apktool.jar d -f base/app-debug.apk -o work

      - name: Install Gotham Gazette web files
        run: |
          mkdir -p work/assets/public
          cp -r www/. work/assets/public/

      - name: Rebuild APK
        run: java -jar apktool.jar b work -o unsigned.apk

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -keystore release.jks \
            -storepass gothamtemp -keypass gothamtemp \
            -alias gotham -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Gotham Gazette"
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass pass:gothamtemp \
            --ks-key-alias gotham \
            --key-pass pass:gothamtemp \
            --out GothamGazette.apk aligned.apk
          "$BT/apksigner" verify GothamGazette.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gotham-Gazette-Android-APK
          path: GothamGazette.apk
