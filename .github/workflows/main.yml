name: Build Gotham Gazette Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download apktool
        run: wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Decode Android shell
        run: java -jar apktool.jar d -f base/app-debug.apk -o work

      - name: Ensure network permission
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'work/AndroidManifest.xml'
          tree = ET.parse(p)
          root = tree.getroot()
          ns = 'http://schemas.android.com/apk/res/android'
          name = '{%s}name' % ns
          if not any(x.tag.endswith('uses-permission') and x.get(name) == 'android.permission.INTERNET' for x in root):
              node = ET.Element('uses-permission')
              node.set(name, 'android.permission.INTERNET')
              root.insert(0, node)
          ET.register_namespace('android', ns)
          tree.write(p, encoding='utf-8', xml_declaration=True)
          PY

      - name: Install Gotham Gazette files
        run: |
          mkdir -p work/assets/public
          cp -r www/. work/assets/public/
          cd android-res
          find . -type f \( -name '*.png' -o -name '*.xml' \) | while read f; do
            mkdir -p "../work/res/$(dirname "$f")"
            cp "$f" "../work/res/$f"
          done
          cd ..
          cp android-res/values/strings.xml work/res/values/strings.xml

      - name: Rebuild APK
        run: java -jar apktool.jar b work -o unsigned.apk

      - name: Align and sign APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          keytool -genkeypair -v -keystore release.jks -storepass gothamtemp -keypass gothamtemp -alias gotham -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Gotham Gazette, O=Gotham Gazette, C=US"
          "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass pass:gothamtemp --ks-key-alias gotham --key-pass pass:gothamtemp --out GothamGazette.apk aligned.apk
          "$BT/apksigner" verify GothamGazette.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gotham-Gazette-Android-APK
          path: GothamGazette.apk
          if-no-files-found: error
          retention-days: 30
